<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="arXiv Filter">
  <!-- 品牌色圆角底：与 app.css 的 --brand 青绿一致 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8f86"/>
      <stop offset="1" stop-color="#1f6f68"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 求和符号 Σ：直接用随包分发的 KaTeX 公式字体，无需另加二进制资源 -->
  <text x="32" y="45" text-anchor="middle" font-family="KaTeX_Main, 'Times New Roman', serif"
        font-size="42" fill="#ffffff">Σ</text>
</svg>
